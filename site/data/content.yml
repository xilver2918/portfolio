        **2026년 3월 · 팀 프로젝트 · 완료**

        중도입국 학생이 여러 곳에 흩어진 교육 지원 정보를 한곳에서 찾을 수 있도록 앱 프로토타입을 만들었습니다.

        **핵심 기능** — 학생이 사용하는 언어에 따라 국내 교육 지원 프로그램을 추천합니다.

        **담당 역할** — 팀에서 풀스택 개발을 맡아 프런트엔드와 백엔드를 구현했습니다.
