########################### About ##################################
about:
  enable: true
  image: 'images/profile-avatar.png'
  image_alt: '은철을 표현한 일러스트'
  title: '자기소개'
  content: |
    컴퓨터공학부 3학년 은철입니다. 클라우드 수업에서 AWS EC2에 웹사이트를 배포하고
    S3에 이미지를 저장하며 서비스 인프라 설계에 흥미를 느꼈습니다.

    현재는 클라우드 기반 영수증 인증 시스템을 설계하고 있습니다.
    영수증을 S3에 임시 저장하고, Lambda에서 오픈소스 OCR로 추출한 결제 시간과 승인번호를
    기존 기록과 비교해 중복을 확인할 계획입니다.
    인증 기능을 구현한 뒤에는 동시 요청에서도 한 번만 처리되는지,
    오류가 발생하면 재시도로 복구할 수 있는지 검증하고 싶습니다.
  button:
    enable: false

