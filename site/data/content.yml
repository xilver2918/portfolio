############################# portfolio ################################
portfolio:
  enable: true
  title: '대표 활동'
  portfolio_list:
    - name: '이:음 · 중도입국 학생을 위한 다국어 문의기관 안내'
      image: 'images/portfolio/ieum-demo.png'
      thumbnail: 'images/portfolio/ieum-cover.png'
      thumbnail_alt: '이:음 프로젝트 상세 보기'
      image_alt: '이:음 사용자 이용 예시 화면'
      url: 'https://education-data.vercel.app/'
      description: |
        **2026년 3월 · AI 활용 공모전 팀 프로젝트 · 완료**

        중도입국 학생과 보호자가 입국 초기 교육 지원 정보를 찾고 문의할 기관을 확인할 수 있도록 웹앱 프로토타입을 만들었습니다.

        **구현 과정** — 팀에서 개발을 맡아 React로 입력과 결과 화면을 만들었습니다. 거주 지역, 주 사용 언어, 학교 상태 등을 입력하면 앱에 포함된 기관 데이터와 자체 추천 기준을 바탕으로 먼저 문의할 기관을 안내합니다.

        **구현 방식 선택 이유** — 학생마다 거주 지역과 학교 상황이 달라, 추천 결과가 교육지원청의 관할과 기관별 지원 기준에 맞아야 한다고 판단했습니다. 범용 AI에 추천을 맡기는 방식과 차별화하기 위해, 학생이 입력한 정보와 기관 데이터를 연결하는 추천 기준을 직접 설계했습니다.

        **결과물** — 시연 화면에는 베트남어를 사용하는 구로구 미입학 학생의 입력 예시와 관할 교육지원청 추천 결과가 나란히 표시됩니다.

        **배운 점과 개선 방향** — 자체 기준으로 추천 흐름을 구현했지만 AI를 적용한 범위는 제한적이었습니다. 다음에는 외부 AI API를 연동하거나 관련 데이터로 학습한 모델을 적용해, 기존 방식보다 학생 상황에 맞는 기관을 추천하는지 비교해 보고 싶습니다.
