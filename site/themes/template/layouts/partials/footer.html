<div class="footer container text-center" id="contact">
  <ul class="footer-icons list-inline">
    {{ range $.Site.Params.social }}
      <li>
        <a href="{{ .link | safeURL }}" aria-label="{{ .label | default .link }}" target="_blank" rel="noreferrer"
          ><i class="{{ .icon }} footer-icon fa-3x" aria-hidden="true"></i
        ></a>
      </li>
    {{ end }}
    {{ with $.Site.Params.contact_email }}
      <li>
        <a class="footer-email" href="{{ printf "mailto:%s" . | safeURL }}" aria-label="은철에게 이메일 보내기">
          <img src="{{ "images/email-icon.png" | relURL }}" alt="" />
        </a>
      </li>
    {{ end }}
  </ul>
  <div class="credit">
    <span>{{ $.Site.Params.copyright | markdownify }} <span id="current-year"></span></span>
    {{ with $.Site.Params.contact_email }}
      <span class="footer-email-address">{{ . }}</span>
    {{ end }}
  </div>
</div>
